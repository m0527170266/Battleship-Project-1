
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>טבלת שיאים - צוללות</title>
    <link rel="stylesheet" href="../style/main.css">
    <link rel="stylesheet" href="../style/leaderboard.css">
    <link rel="icon" href="../favicon.ico.ico">
</head>
<body>

    <header>
        <h1>היכל התהילה</h1>
    </header>

    <main>
        <section class="form-container" style="max-width: 600px;">  <!-- לקופסא שאורזת את הטופס -->
            <div id="top-winner-section" style="display: none; text-align: center; margin-bottom: 25px;">  <!-- זה בשביל המנצח במקום הראשון -->
                <span style="font-size: 60px;">🏆</span>
                <h2 id="top-player-name" style="color: #ef4444; margin: 10px 0; font-size: 2.2rem; font-weight: bold;"></h2>
                <p style="font-size: 1.2rem; font-weight: bold; color: #1a3c5a;">במקום הראשון!</p>
                <hr style="border: 0; border-top: 1px solid #ddd; margin: 20px 0;">
            </div>

            <h2 style="display: flex; align-items: center; justify-content: center; gap: 15px;">
                הצוללנים המצטיינים
            </h2>
            
            <table id="leaderboard-table">
                <thead>
                    <tr>
                        <th>דירוג</th>
                        <th>שם שחקן</th>
                        <th>ניסיונות</th>
                    </tr>
                </thead>
                <tbody id="leaderboard-body">  <!-- השלד של טבלת השיאים --> 
                    <tr>
                        <td colspan="3" style="padding: 30px; color: #666;">
                            עדין אין שיאים... זה הזמן להיות הראשונים בטבלה!
                        </td>
                    </tr>
                </tbody>
            </table>

            <div style="margin-top: 30px; text-align: center;">
                <button id="back-btn" class="btn-clean">חזרה לתפריט הראשי</button>
            </div>
        </section>
    </main>


    <footer>
        <p>סמינר מאיר - פרויקט JS</p>
    </footer>

        // כפתור חזרה לדף הבית
        document.getElementById('back-to-menu').addEventListener('click', () => {
            window.location.href = '../index.html';
        });
    </script> -->
        <script type="module" src="../script/app.js"></script>

    
</body>
</html>
